# ============================================
# Hospital Management System - Application Properties
# ============================================

# Server
server.port=${PORT:8080}

# MySQL Database Configuration
# In production (Render/Railway), provide DB_URL, DB_USERNAME, DB_PASSWORD environment variables.
# For local development, defaults to localhost:3306.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:HospitalManagementSystemSecretKeyForJWTTokenGeneration2024SecureKey}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration (optional comma-separated list of additional allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Logging
logging.level.com.hospital=INFO
logging.level.org.springframework.security=WARN
